<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Obsidian Chess</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="topbar">
            <div>
                <p class="eyebrow">CHESS ENGINE</p>
                <h1>♟ Obsidian</h1>
                <p class="subtitle">Speel schaak tegen Obsidian.</p>
            </div>

            <div id="status" class="status">
                Kies je kleur
            </div>
        </header>


        <!-- Kleur kiezen -->
        <section id="setup" class="setup">

            <div class="setup-card">

                <p class="eyebrow">NIEUW SPEL</p>

                <h2>Kies je kleur</h2>

                <p class="description">
                    Kies met welke kleur je wilt spelen.
                </p>

                <div class="color-buttons">

                    <button
                        id="whiteBtn"
                        class="color-button"
                        type="button"
                    >
                        <span class="piece-icon">♔</span>
                        <span>
                            <strong>Wit</strong>
                            <small>Jij begint</small>
                        </span>
                    </button>

                    <button
                        id="blackBtn"
                        class="color-button"
                        type="button"
                    >
                        <span class="piece-icon">♚</span>
                        <span>
                            <strong>Zwart</strong>
                            <small>Obsidian begint</small>
                        </span>
                    </button>

                </div>

            </div>

        </section>


        <!-- Spel -->
        <main id="game" class="game hidden">

            <section class="board-section">

                <div id="board" class="board"></div>

            </section>


            <aside class="sidebar">

                <div class="card">

                    <div class="card-header">
                        <h2>Obsidian</h2>
                        <span class="online-dot"></span>
                    </div>

                    <p id="gameMessage">
                        Klaar om te spelen.
                    </p>

                </div>


                <div class="card">

                    <div class="card-header">
                        <h2>Zetten</h2>

                        <span id="moveCount" class="move-count">
                            0
                        </span>
                    </div>

                    <div id="moves" class="moves">
                        <p class="empty-moves">
                            Nog geen zetten.
                        </p>
                    </div>

                </div>


                <button
                    id="newGameBtn"
                    class="new-game-button"
                    type="button"
                >
                    Nieuw spel
                </button>

            </aside>

        </main>

    </div>


    <!-- chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <!-- Onze eigen code -->
    <script src="Obsidian.js"></script>
    <script src="main.js"></script>

</body>
</html>
